collections:
  authors:
    output: true
  themes:
    output: true

defaults:
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "default"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-redirect-from

title: Эвенская экспедиция
description: Электронный портал о быстринском диалекте эвенского языка
url: https://evenlang.ru
baseurl: ""
lang: ru

paginate: 5
paginate_path: '/scientific/main/page:num/'

# paginate_multiple:
#   - paginate: 5
#     paginate_path: '/scientific/main/page:num/'
#     sub_dir: '/scientific'
