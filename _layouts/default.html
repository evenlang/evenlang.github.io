<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#087f86">
    <meta name="color-scheme" content="light">
    {% seo %}
    <link rel="icon" href="{{ '/static/img/icon.png' | relative_url }}">
    <link rel="preload" href="{{ '/static/fonts/SourceSerifPro-Regular.ttf' | relative_url }}" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="{{ '/bootstrap/bootstrap.min.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}">
    {% if page.title == 'Галерея' %}<link rel="stylesheet" href="{{ '/assets/css/gallery.css' | relative_url }}">{% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Перейти к содержимому</a>
    {% include navigation_scientific.html %}
    <div id="main-content" class="site-content">
      {{ content }}
    </div>
    {% include footer.html %}
    <script src="{{ '/assets/js/app.js' | relative_url }}" defer></script>
    {% if page.title == 'Галерея' %}<script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>{% endif %}
  </body>
</html>
