<header class="site-header">
  <nav class="site-nav container" aria-label="Основная навигация">
    <a class="site-logo" href="{{ '/scientific/main/' | relative_url }}" aria-label="Эвенская экспедиция — главная">
      <img src="{{ '/static/img/logo.png' | relative_url }}" width="184" height="50" alt="Эвенская экспедиция">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
      <span class="nav-toggle-icon" aria-hidden="true"></span><span class="sr-only">Открыть меню</span>
    </button>
    <div class="site-menu" id="site-menu">
      <a href="{{ '/scientific/main/' | relative_url }}"{% if page.title == 'Новости' %} aria-current="page"{% endif %}>Новости</a>
      <a href="{{ '/scientific/field.html' | relative_url }}"{% if page.title == 'Поле' %} aria-current="page"{% endif %}>Поле</a>
      <a href="{{ '/scientific/about.html' | relative_url }}"{% if page.title == 'О нас' %} aria-current="page"{% endif %}>О нас</a>
      <div class="nav-dropdown">
        <button class="dropdown-toggle" type="button" aria-expanded="false"{% if page.title == 'Тексты' or page.title == 'Газета' %} aria-current="page"{% endif %}>Тексты</button>
        <div class="dropdown-panel">
          <a href="{{ '/scientific/texts.html' | relative_url }}">Устные и письменные тексты</a>
          <a href="{{ '/scientific/texts_newspaper.html' | relative_url }}">Газета «Айдит»</a>
        </div>
      </div>
      <a href="{{ '/scientific/materials.html' | relative_url }}"{% if page.title == 'Материалы' %} aria-current="page"{% endif %}>Материалы</a>
      <a href="{{ '/scientific/articles.html' | relative_url }}"{% if page.title == 'Публикации' %} aria-current="page"{% endif %}>Публикации</a>
      <a href="{{ '/scientific/gallery.html' | relative_url }}"{% if page.title == 'Галерея' %} aria-current="page"{% endif %}>Галерея</a>
      <a href="{{ '/scientific/acknowledgments.html' | relative_url }}"{% if page.title == 'Благодарности' %} aria-current="page"{% endif %}>Благодарности</a>
    </div>
  </nav>
</header>
