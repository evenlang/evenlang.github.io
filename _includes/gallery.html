<div id="gallery-data" data-captions='{% include captions.html %}' hidden></div>
<div class="gallery-grid" aria-label="Фотографии экспедиции">
  {% assign gallery_images = site.static_files | where_exp: 'image', "image.path contains '/assets/gallery/'" | sort: 'basename' %}
  {% for image in gallery_images %}
    <figure class="mosaicflow__item">
      <button class="myBtn" type="button" data-gallery-src="{{ image.path | relative_url }}" data-gallery-key="{{ image.basename }}" aria-label="Открыть фотографию {{ forloop.index }}">
        <img class="myImg" src="{{ image.path | relative_url }}" alt="Фотография экспедиции {{ forloop.index }}" loading="lazy" decoding="async">
      </button>
    </figure>
  {% endfor %}
</div>
<div class="gallery-modal" role="dialog" aria-modal="true" aria-label="Просмотр фотографии" hidden>
  <button class="close" type="button" aria-label="Закрыть">×</button>
  <div>
    <img src="" alt="">
    <div class="caption" aria-live="polite"></div>
  </div>
</div>
